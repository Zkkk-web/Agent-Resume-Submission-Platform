<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">天才职业顾问产品流程示意</title>
  <desc id="desc">黑白界面中，候选人上传简历后完成职业档案、来源推荐、岗位匹配和岗位专用简历。</desc>
  <rect width="1200" height="640" fill="#ffffff"/>
  <rect x="40" y="40" width="1120" height="560" rx="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <path d="M40 98H1160" stroke="#111111" stroke-width="2"/>
  <circle cx="74" cy="69" r="6" fill="#111111"/>
  <circle cx="96" cy="69" r="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <circle cx="118" cy="69" r="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="154" y="75" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="650">天才职业顾问</text>
  <text x="1080" y="75" text-anchor="end" fill="#666666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">LOCAL FIRST</text>

  <text x="76" y="154" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="720">先了解你，再开始找工作。</text>
  <text x="76" y="187" fill="#666666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">一次建立职业档案，持续用于找岗、申请和面试准备。</text>

  <rect x="224" y="221" width="500" height="62" rx="14" fill="#111111"/>
  <text x="250" y="258" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">帮我找适合的 AI 产品岗位，这是我的简历。</text>

  <text x="76" y="330" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="650">我先看材料，暂时不会上传或投递。</text>

  <rect x="76" y="365" width="18" height="18" fill="#111111"/>
  <path d="M81 374l4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="379" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="620">职业档案已建立</text>
  <text x="320" y="379" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">真实经历 · 求职偏好 · 长期记忆</text>

  <rect x="76" y="411" width="18" height="18" fill="#111111"/>
  <path d="M81 420l4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="425" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="620">推荐 5 个岗位来源</text>
  <text x="320" y="425" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">确认范围后再搜索</text>

  <rect x="76" y="457" width="18" height="18" fill="#111111"/>
  <path d="M81 466l4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="471" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="620">岗位专用简历已生成</text>
  <text x="320" y="471" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">可以修改 HTML 并下载 PDF</text>

  <path d="M770 120V526" stroke="#dddddd" stroke-width="1"/>
  <rect x="806" y="129" width="302" height="386" rx="12" fill="#f7f7f7" stroke="#e4e4e4"/>
  <text x="836" y="171" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700">CURRENT FLOW</text>

  <path d="M855 210V445" stroke="#cccccc" stroke-width="2"/>
  <circle cx="855" cy="222" r="12" fill="#111111"/>
  <text x="855" y="227" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11" font-weight="700">1</text>
  <text x="886" y="228" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="650">读取材料</text>
  <text x="886" y="249" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">本地处理</text>

  <circle cx="855" cy="292" r="12" fill="#111111"/>
  <text x="855" y="297" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11" font-weight="700">2</text>
  <text x="886" y="298" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="650">完善档案</text>
  <text x="886" y="319" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">一次只问一个问题</text>

  <circle cx="855" cy="362" r="12" fill="#111111"/>
  <text x="855" y="367" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11" font-weight="700">3</text>
  <text x="886" y="368" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="650">多来源找岗</text>
  <text x="886" y="389" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">先确认，再访问</text>

  <circle cx="855" cy="432" r="12" fill="#111111"/>
  <text x="855" y="437" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="11" font-weight="700">4</text>
  <text x="886" y="438" fill="#111111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="650">定制与申请</text>
  <text x="886" y="459" fill="#777777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12">最终提交由你完成</text>

  <path d="M76 534H724" stroke="#dddddd"/>
  <text x="76" y="565" fill="#666666" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">本地处理　·　明确授权　·　可随时暂停　·　最终提交由你完成</text>
</svg>
